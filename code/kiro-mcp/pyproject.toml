[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidlc-mcp"
version = "0.1.0"
description = "Platform MCP server: Kiro IDE frontend for the Agentic SDLC Transformation platform"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",  # pin to official FastMCP line; avoid untrusted 2.x
    "boto3>=1.34.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pyyaml>=6"]

[project.scripts]
aidlc-mcp = "aidlc_mcp.__main__:main"

[tool.setuptools]
packages = ["aidlc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
